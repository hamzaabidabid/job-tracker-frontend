# server {
#     listen 80;
#     server_name localhost;
#
#     # --- CORRECTION IMPORTANTE ---
#     # On indique à Nginx d'utiliser le resolver DNS interne de Kubernetes.
#     # 127.0.0.11 est une adresse standard pour les resolvers internes de conteneurs.
#     # 'valid=5s' signifie qu'il mettra en cache l'adresse IP pendant 5 secondes.
#     resolver 127.0.0.11 valid=5s;
#     # ---------------------------
#
#     root /usr/share/nginx/html;
#     index index.html;
#
#     location /api/ {
#         # --- CORRECTION IMPORTANTE ---
#         # On utilise une variable pour le nom du service.
#         # Cela force Nginx à réévaluer l'adresse IP à chaque requête
#         # au lieu de la mettre en cache une seule fois au démarrage.
#         set $backend_service "backend-service";
#         proxy_pass http://backend-service:8082;
#         # ---------------------------
#
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
# }
server {
    listen 80;

    # Servir le Frontend (React/Angular/Vue)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Rediriger les appels API vers le Backend interne
    # Attention : "backend-service" doit être le nom exact de votre Service K8s dans backend.yml
    location /api/ {
        proxy_pass http://backend-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
